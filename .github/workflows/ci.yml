name: Enterprise CI — Required Checks

# This workflow defines the enforcement layer for branch protection.
# Job names here MUST match exactly what setup-branch-protection.sh registers
# as required status checks. Renaming a job = breaking the protection gate.

on:
  pull_request:
    branches: [ main ]

jobs:
  # ── 1. Secret Scanning ───────────────────────────────────────────────────
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. Static Application Security Testing ──────────────────────────────
  sast-scan:
    name: sast-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: auto
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # ── 3. Lint ──────────────────────────────────────────────────────────────
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read lint_cmd from project-config.json
        id: config
        run: |
          CMD=$(python3 -c "import json; d=json.load(open('project-config.json')); v=d.get('lint_cmd'); print(v if v else 'null')")
          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"

      - name: Block if lint_cmd is null
        if: steps.config.outputs.cmd == 'null'
        run: |
          echo "ERROR: lint_cmd is null in project-config.json. Configure it before merging."
          exit 1

      - name: Run verify.sh (lint)
        run: bash scripts/verify.sh lint

  # ── 4. Build ─────────────────────────────────────────────────────────────
  build:
    name: build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Read build_cmd
        id: config
        run: |
          CMD=$(python3 -c "import json; d=json.load(open('project-config.json')); v=d.get('build_cmd'); print(v if v else 'null')")
          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"

      - name: Block if build_cmd is null
        if: steps.config.outputs.cmd == 'null'
        run: |
          echo "ERROR: build_cmd is null in project-config.json."
          exit 1

      - name: Run verify.sh (build)
        run: bash scripts/verify.sh build

  # ── 5. Test + Coverage Gate ──────────────────────────────────────────────
  test-and-coverage:
    name: test-and-coverage
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Read test_cmd
        id: config
        run: |
          CMD=$(python3 -c "import json; d=json.load(open('project-config.json')); v=d.get('test_cmd'); print(v if v else 'null')")
          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"

      - name: Block if test_cmd is null
        if: steps.config.outputs.cmd == 'null'
        run: |
          echo "ERROR: test_cmd is null in project-config.json."
          exit 1

      - name: Run verify.sh (test + coverage threshold)
        run: bash scripts/verify.sh test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            .coverage
            .agents/scratch/verification-report.txt
